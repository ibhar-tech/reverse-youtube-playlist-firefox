<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="popup-header">
      <span class="popup-title">
        <span id="popup-title-icon" class="popup-icon"></span>
        <span data-i18n="extensionName">Playlist Tools</span>
      </span>
      <div class="header-actions">
        <select id="lang-select" class="lang-select" title="Language">
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="ar">ع</option>
        </select>
        <button id="settings-btn" class="header-action-btn" title="Settings"></button>
      </div>
    </header>

    <main class="popup-main">
      <!-- Settings Panel -->
      <div id="settings-panel" class="settings-panel" style="display: none;">
        <div class="settings-group">
          <label class="setting-switch-label">
            <input type="checkbox" id="disable-autoplay-toggle">
            <span class="setting-switch-text" data-i18n="disableAutoplay">Don't autoplay the next playlist video</span>
          </label>
        </div>
        <div class="settings-group">
          <label class="setting-switch-label">
            <input type="checkbox" id="skip-watched-toggle">
            <span class="setting-switch-text" data-i18n="autoSkip">Auto-skip watched</span>
          </label>
        </div>
        <div class="settings-group">
          <label class="setting-switch-label">
            <input type="checkbox" id="show-badges-toggle">
            <span class="setting-switch-text" data-i18n="showBadges">Show watched badges</span>
          </label>
        </div>
        <div class="settings-group">
          <label class="setting-switch-label">
            <input type="checkbox" id="loop-toggle">
            <span class="setting-switch-text" data-i18n="loop">Loop playlist order</span>
          </label>
        </div>
        <div class="settings-group">
          <label class="setting-switch-label">
            <input type="checkbox" id="resume-toggle">
            <span class="setting-switch-text" data-i18n="resumePrompt">Offer to resume playlists</span>
          </label>
        </div>
        <div class="settings-group">
          <label class="setting-switch-label">
            <input type="checkbox" id="compact-toggle">
            <span class="setting-switch-text" data-i18n="compact">Compact layout</span>
          </label>
        </div>

        <!-- Button Visibility Sub-section -->
        <div class="settings-divider"></div>
        <div class="settings-section-title" data-i18n="buttonVisibilitySection">Button Visibility</div>
        <div class="button-visibility-grid">
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-reverse" data-btn-key="reverse" checked>
            <span class="btn-vis-label" data-i18n="btnVisReverse">Reverse</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-shuffle" data-btn-key="shuffle" checked>
            <span class="btn-vis-label" data-i18n="btnVisShuffle">Shuffle</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-sort" data-btn-key="sort" checked>
            <span class="btn-vis-label" data-i18n="btnVisSort">Sort</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-reorder" data-btn-key="reorder" checked>
            <span class="btn-vis-label" data-i18n="btnVisReorder">Reorder</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-reset" data-btn-key="reset" checked>
            <span class="btn-vis-label" data-i18n="btnVisReset">Reset</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-save" data-btn-key="save" checked>
            <span class="btn-vis-label" data-i18n="btnVisSave">Save</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-myLists" data-btn-key="myLists" checked>
            <span class="btn-vis-label" data-i18n="btnVisMyLists">My Lists</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-duration" data-btn-key="duration" checked>
            <span class="btn-vis-label" data-i18n="btnVisDuration">Duration</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-loadAll" data-btn-key="loadAll" checked>
            <span class="btn-vis-label" data-i18n="btnVisLoadAll">Load All</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-addVideo" data-btn-key="addVideo" checked>
            <span class="btn-vis-label" data-i18n="btnVisAddVideo">Add to Playlist</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-export" data-btn-key="export" checked>
            <span class="btn-vis-label" data-i18n="btnVisExport">Export list</span>
          </label>
          <label class="btn-vis-item">
            <input type="checkbox" id="btn-vis-channelPlay" data-btn-key="channelPlay" checked>
            <span class="btn-vis-label" data-i18n="btnVisChannelPlay">Channel: oldest first</span>
          </label>
        </div>

        <div class="settings-group clear-badges-group">
          <button id="clear-watched-btn" class="popup-btn danger-btn" data-i18n="clearWatched">Clear watched badges</button>
        </div>

        <div class="settings-divider"></div>
        <div class="settings-section-title" data-i18n="backupSectionTitle">Backup & Restore</div>
        <div class="settings-backup-actions">
          <button id="drawer-export-btn" class="popup-btn secondary-btn" data-i18n="exportBackup">Export Playlists & Settings</button>
          <button id="drawer-import-btn" class="popup-btn secondary-btn" data-i18n="importBackup">Import Backup File</button>
        </div>
      </div>

      <!-- Quick Add Current Video Banner (visible on any YouTube watch page) -->
      <div id="add-video-section" class="add-video-section" style="display: none;">
        <button id="add-current-video-btn" class="add-current-video-btn">
          <span>＋</span>
          <span data-i18n="addCurrentVideo">Add Current Video to Playlist</span>
        </button>
      </div>

      <!-- Save current playlist section (visible on watch pages with playlist) -->
      <div id="save-current-section" class="save-current-section" style="display: none;">
        <label for="save-input-popup" class="save-label" data-i18n="saveCurrentSectionLabel">Save current playlist state:</label>
        <div class="save-inputs-stack">
          <input type="text" id="save-input-popup" class="save-input" data-i18n="saveInputPlaceholder" placeholder="e.g. My Custom Sort" maxlength="80">
          <input type="text" id="save-tags-popup" class="save-input tags-input" data-i18n="tagsPlaceholder" placeholder="Tags (comma separated)" maxlength="200">
        </div>
        <button id="save-confirm-popup" class="save-confirm"></button>
      </div>

      <!-- Your stats (hidden until there is something to show) -->
      <section id="stats-card" class="stats-card" style="display: none;" aria-labelledby="stats-title">
        <div class="stats-head">
          <span id="stats-title" class="stats-title" data-i18n="statsTitle">Your stats</span>
          <button id="stats-share-btn" class="stats-share-btn" type="button" data-i18n="shareStats">Share</button>
        </div>
        <div class="stats-grid">
          <div class="stat"><span id="stat-watched" class="stat-value">0m</span><span class="stat-label" data-i18n="statWatched">watched in playlists</span></div>
          <div class="stat"><span id="stat-saved" class="stat-value">0m</span><span class="stat-label" data-i18n="statSaved">saved by playback speed</span></div>
          <div class="stat"><span id="stat-finished" class="stat-value">0</span><span class="stat-label" data-i18n="statFinished">videos finished</span></div>
          <div class="stat"><span id="stat-orders" class="stat-value">0</span><span class="stat-label" data-i18n="statOrders">playlists reversed, shuffled or sorted</span></div>
        </div>
      </section>

      <!-- Saved snapshots section -->
      <div class="list-header">
        <span class="list-header-title">
          <span data-i18n="savedSnapshots">Saved Snapshots</span>
          <span id="list-count" class="list-count" style="display: none;">0</span>
        </span>
        <button id="delete-all-btn" class="delete-all-btn" data-i18n="deleteAll" style="display: none;">Delete All</button>
      </div>

      <div id="search-container" class="search-container" style="display: none;">
        <input type="text" id="popup-search-input" class="popup-search-input" data-i18n="searchSnapshots" placeholder="Search names or tags...">
      </div>

      <div id="playlist-list" class="playlist-list">
        <!-- Playlists will be loaded dynamically here -->
      </div>
    </main>

    <footer class="popup-footer">
      <div class="footer-actions">
        <button id="export-btn" class="footer-action-btn" title="Export saved playlists"></button>
        <button id="import-btn" class="footer-action-btn" title="Import saved playlists"></button>
        <button id="support-btn" class="footer-action-btn" title="Support this project">❤️</button>
        <button id="guide-btn" class="footer-action-btn" type="button" data-i18n="guideShortcuts">Guide & shortcuts</button>
      </div>
      <a id="rate-link" class="rate-link" data-i18n="rateUs"
         href="https://addons.mozilla.org/firefox/addon/reverse-youtube-playlist-order/reviews/"
         target="_blank" rel="noopener">Enjoying it? Leave a review ★</a>
    </footer>

    <script src="../src/backup.js"></script>
    <script src="../src/links.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
